version: '3.7'

services:
  db:
    container_name: ndoj_mysql
    image: mariadb:10.11
    restart: unless-stopped
    volumes:
      - ./database/:/var/lib/mysql/
    env_file: [environment/mysql.env, environment/mysql-admin.env]
    networks: [db]
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    container_name: ndoj_redis
    image: redis:alpine
    restart: unless-stopped
    networks: [site]

  base:
    build:
      context: .
      dockerfile: ./base/Dockerfile
    image: ndoj/ndoj-base
    network_mode: none

  site:
    container_name: ndoj_site
    build:
      context: .
      dockerfile: ./site/Dockerfile
    image: ndoj/ndoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/assets/
      - userdatacache:/userdatacache/
      - contestdatacache:/contestdatacache/
      - cache:/cache/
      - ./media/:/media/
      - ./problems/:/problems/
      - ./repo/:/site/
    working_dir: /site/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    depends_on: [base, db, redis]

  celery:
    container_name: ndoj_celery
    build:
      context: .
      dockerfile: ./celery/Dockerfile
    image: ndoj/ndoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - userdatacache:/userdatacache/
      - contestdatacache:/contestdatacache/
      - ./repo/:/site/
    working_dir: /site/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, db]
    depends_on: [base, db, redis]

  bridged:
    container_name: ndoj_bridged
    build:
      context: .
      dockerfile: ./bridged/Dockerfile
    image: ndoj/ndoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - ./problems/:/problems/
      - ./repo/:/site/
    working_dir: /site/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    depends_on: [base, db, redis]
    ports:
      - "9998:9998"
      - "9999:9999"

  wsevent:
    container_name: ndoj_wsevent
    build:
      context: .
      dockerfile: ./wsevent/Dockerfile
    image: ndoj/ndoj-wsevent
    init: true
    restart: unless-stopped
    volumes:
      - ./repo/:/app/site/
    working_dir: /app/site
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx]
    depends_on: [base]

  nginx:
    container_name: ndoj_nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - assets:/assets/
      - userdatacache:/userdatacache/
      - contestdatacache:/contestdatacache/
      - cache:/cache/
      - ./media/:/media/
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks: [nginx]
    depends_on: [site, wsevent]

  judge:
    container_name: ndoj_judge_1
    image: dmoj/judge-tier1:latest
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    volumes:
      - ./problems/:/problems/
      - ./config/judge.yml:/judge.yml:ro
    command: run -c /judge.yml bridged ndoj_judge_1 ndoj_secret_judge_key_2026
    networks: [site]
    depends_on: [bridged]

networks:
  site:
  db:
  nginx:

volumes:
  assets:
  userdatacache:
  contestdatacache:
  cache:
